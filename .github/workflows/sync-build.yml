name: Sync & Build danmu-api (linux/arm/v7)

# 本仓库不保存上游源码：每次构建时从 huangxd-/danmu_api 直接 clone 最新代码，
# 交叉构建 linux/arm/v7 镜像，推送三个 registry：
#   ghcr.io/viciy2023/danmu-api-deploy   —— 备用通道，只需 GITHUB_TOKEN
#   <DOCKERHUB_USERNAME>/danmu-api       —— 需配 DOCKERHUB_* secrets
#   <ACR_HOST>/<ACR_NAMESPACE>/danmu-api-deploy —— 阿里云 ACR 个人版，国内最快
#
# 任一口令通道凭据缺失或登录失败，只跳过该通道，不影响其他通道。
# 上游 SHA + BUILD_REV + 通道状态 组成构建指纹写入 last-build.txt，无变化时跳过构建。

on:
  schedule:
    # 每天 UTC 18:00 = 北京 02:00
    - cron: '0 18 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: "上游 SHA 未变化也强制重建（首次启用、补推某个 registry 时用）"
        type: boolean
        default: false

env:
  UPSTREAM_REPO: huangxd-/danmu_api
  UPSTREAM_BRANCH: main
  IMAGE_NAME: ghcr.io/viciy2023/danmu-api-deploy
  # 完整镜像名 <DOCKERHUB_USERNAME>/<DOCKERHUB_REPO>
  DOCKERHUB_REPO: danmu-api
  # 阿里云 ACR 个人版：这些是公开标识，不是密钥；ALIYUN_REGISTRY secret 可覆盖 host
  ACR_HOST: <ALIYUN_REGISTRY>
  ACR_NAMESPACE: <ALIYUN_NAMESPACE>
  ACR_REPO: danmu-api-deploy
  # 改了构建策略（基础镜像、标签规则、缓存方式）就 +1，强制重建一次
  BUILD_REV: v1

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.compare.outputs.changed }}
      upstream_sha: ${{ steps.compare.outputs.upstream_sha }}
      hub: ${{ steps.compare.outputs.hub }}
      acr: ${{ steps.compare.outputs.acr }}
    steps:
      - name: Checkout deploy repo
        uses: actions/checkout@v4

      - name: Compare upstream SHA with last build
        id: compare
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DH_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          DH_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          ALI_USER: ${{ secrets.ALIYUN_USERNAME }}
          ALI_PASS: ${{ secrets.ALIYUN_PASSWORD }}
        run: |
          UPSTREAM_SHA=$(gh api "repos/${UPSTREAM_REPO}/commits/${UPSTREAM_BRANCH}" --jq '.sha')
          echo "upstream_sha=$UPSTREAM_SHA" >> "$GITHUB_OUTPUT"

          if [ -n "$DH_USER" ] && [ -n "$DH_TOKEN" ]; then
            HUB=hub
            echo "Docker Hub 凭据已配置，本次会尝试推送 Docker Hub。"
          else
            HUB=nohub
            echo "未配置 Docker Hub 凭据，跳过 Docker Hub。"
          fi
          echo "hub=$HUB" >> "$GITHUB_OUTPUT"

          if [ -n "$ALI_USER" ] && [ -n "$ALI_PASS" ]; then
            ACR=acr
            echo "阿里云 ACR 凭据已配置，本次会尝试推送 ACR。"
          else
            ACR=noacr
            echo "未配置阿里云 ACR 凭据，跳过 ACR。"
          fi
          echo "acr=$ACR" >> "$GITHUB_OUTPUT"

          LAST_LINE=$(tr -d '[:space:]' < last-build.txt 2>/dev/null || true)
          WANT_FP="${UPSTREAM_SHA}${BUILD_REV}${HUB}${ACR}"
          echo "want_fp=$WANT_FP"
          echo "last_fp=${LAST_LINE:-<空>}"

          if [ "$WANT_FP" = "$LAST_LINE" ] && [ "${{ inputs.force }}" != "true" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "上游未变化，跳过构建。"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "检测到变化，开始构建。"
          fi

  build:
    needs: check
    if: needs.check.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout deploy repo
        uses: actions/checkout@v4

      - name: Clone upstream source
        run: |
          git clone --depth 1 --branch "${UPSTREAM_BRANCH}" "https://github.com/${UPSTREAM_REPO}.git" upstream
          echo "upstream HEAD: $(git -C upstream rev-parse HEAD)"

      # node:24-alpine 起官方镜像不再提供 arm/v7（实测 24-alpine 只有 arm64/v8）。
      # 这里强制锁定 node:22-alpine，防止上游升级基础镜像后 armv7 构建突然失败。
      - name: Pin base image to node:22-alpine
        run: |
          echo "BEFORE:"; grep -E '^FROM ' upstream/Dockerfile
          sed -i -E 's|^FROM node:[0-9]+(-alpine)?|FROM node:22-alpine|' upstream/Dockerfile
          echo "AFTER:";  grep -E '^FROM ' upstream/Dockerfile

      - name: Read version from upstream globals.js
        id: ver
        run: |
          VERSION=$(grep -m1 "VERSION:" upstream/danmu_api/configs/globals.js | sed -E "s/.*VERSION: '(.*)'.*/\1/")
          if [ -z "$VERSION" ]; then
            echo "无法从上游 danmu_api/configs/globals.js 解析版本号"
            exit 1
          fi
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"
          echo "上游版本号: $VERSION"

      # ALIYUN_REGISTRY 支持两种写法：
      #   registry.cn-hangzhou.aliyuncs.com/命名空间
      #   registry.cn-hangzhou.aliyuncs.com  （此时用 ACR_NAMESPACE 默认值）
      - name: Resolve ACR settings
        id: acrset
        env:
          ALI_REG: ${{ secrets.ALIYUN_REGISTRY }}
        run: |
          ALI_HOST="${ALI_REG%%/*}"
          if [ -z "$ALI_HOST" ]; then
            ALI_HOST="${ACR_HOST}"
          fi
          if [ -n "$ALI_REG" ] && [ "$ALI_REG" != "$ALI_HOST" ]; then
            ALI_NAMESPACE="${ALI_REG#*/}"
          else
            ALI_NAMESPACE="${ACR_NAMESPACE}"
          fi
          echo "host=${ALI_HOST}" >> "$GITHUB_OUTPUT"
          echo "namespace=${ALI_NAMESPACE}" >> "$GITHUB_OUTPUT"
          echo "ACR host=${ALI_HOST} namespace=${ALI_NAMESPACE} repo=${ACR_REPO}"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: needs.check.outputs.hub == 'hub'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 凭据错误时只跳过 ACR，不能拖垮 Docker Hub / GHCR 的推送
      - name: Diagnose ACR credentials (no secret values printed)
        if: needs.check.outputs.acr == 'acr'
        env:
          ALI_U: ${{ secrets.ALIYUN_USERNAME }}
          ALI_P: ${{ secrets.ALIYUN_PASSWORD }}
          ALI_R: ${{ secrets.ALIYUN_REGISTRY }}
        run: |
          echo "ALIYUN_USERNAME 长度: ${#ALI_U}"
          echo "ALIYUN_PASSWORD 长度: ${#ALI_P}"
          echo "ALIYUN_REGISTRY 是否为空: $([ -z "$ALI_R" ] && echo 是 || echo 否)"
          echo "解析出的 host: ${{ steps.acrset.outputs.host }}"
          echo "解析出的 namespace: ${{ steps.acrset.outputs.namespace }}"
          case "$ALI_P" in
            [\ \	]*) echo "::warning::ALIYUN_PASSWORD 以空白字符开头，很可能是复制时带进来的";;
          esac
          case "$ALI_P" in
            *[\ \	]) echo "::warning::ALIYUN_PASSWORD 以空白字符结尾，很可能是复制时带进来的";;
          esac
          if printf '%s' "$ALI_P" | grep -q $'\r'; then
            echo "::warning::ALIYUN_PASSWORD 中含回车符（CRLF 残留）"
          fi

          # 绕过 docker login 的笼统报错，直接问 ACR 的 token 端点：凭据本身到底收不收
          HOST="${{ steps.acrset.outputs.host }}"
          NS="${{ steps.acrset.outputs.namespace }}"
          SCOPE="repository:${NS}/${ACR_REPO}:pull,push"
          CHALLENGE=$(curl -s -D - -o /dev/null "https://${HOST}/v2/" | grep -i '^www-authenticate' | tr -d '\r')
          REALM=$(printf '%s' "$CHALLENGE" | sed -n 's/.*realm="\([^"]*\)".*/\1/p')
          SERVICE=$(printf '%s' "$CHALLENGE" | sed -n 's/.*service="\([^"]*\)".*/\1/p')
          echo "token 端点: ${REALM:-<未解析到>}"
          if [ -n "$REALM" ]; then
            CODE=$(curl -s -o /tmp/acr_auth.json -w '%{http_code}' -u "${ALI_U}:${ALI_P}" \
              "${REALM}?service=${SERVICE}&scope=${SCOPE}")
            echo "token 端点 HTTP: ${CODE}"
            if grep -q '"token"' /tmp/acr_auth.json 2>/dev/null; then
              echo "结论: 凭据有效，ACR 已签发 token（问题在 docker login 环节，不在密码）"
            else
              echo "结论: 凭据被拒，ACR 返回如下（不含密钥）："
              head -c 300 /tmp/acr_auth.json
              echo
            fi
          fi

      - name: Log in to Aliyun ACR
        id: acrlogin
        if: needs.check.outputs.acr == 'acr'
        continue-on-error: true
        uses: docker/login-action@v3
        with:
          registry: ${{ steps.acrset.outputs.host }}
          username: ${{ secrets.ALIYUN_USERNAME }}
          password: ${{ secrets.ALIYUN_PASSWORD }}

      - name: Assemble push targets
        id: tags
        env:
          DH_USER: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          SHA="${{ needs.check.outputs.upstream_sha }}"
          SHORT="${SHA:0:12}"
          VER="${{ steps.ver.outputs.value }}"
          TAGS="${IMAGE_NAME}:latest,${IMAGE_NAME}:armv7,${IMAGE_NAME}:sha-${SHORT}"

          if [ "${{ needs.check.outputs.hub }}" = "hub" ]; then
            DEST="docker.io/${DH_USER}/${DOCKERHUB_REPO}"
            TAGS="${TAGS},${DEST}:latest,${DEST}:armv7,${DEST}:${VER},${DEST}:sha-${SHORT}"
          fi

          if [ "${{ steps.acrlogin.outcome }}" = "success" ]; then
            ACR_DEST="${{ steps.acrset.outputs.host }}/${{ steps.acrset.outputs.namespace }}/${ACR_REPO}"
            TAGS="${TAGS},${ACR_DEST}:latest,${ACR_DEST}:armv7,${ACR_DEST}:${VER},${ACR_DEST}:sha-${SHORT}"
          elif [ "${{ needs.check.outputs.acr }}" = "acr" ]; then
            echo "::warning::阿里云 ACR 登录失败，本次跳过 ACR 推送，仅推送 GHCR / Docker Hub。请检查 ALIYUN_USERNAME / ALIYUN_PASSWORD。"
          fi

          echo "value=${TAGS}" >> "$GITHUB_OUTPUT"
          echo "推送目标: ${TAGS}"

      - name: Build and push (linux/arm/v7)
        uses: docker/build-push-action@v6
        with:
          context: ./upstream
          platforms: linux/arm/v7
          push: true
          # 关掉 attestation，否则 manifest 里多出 unknown 架构，老版本 Docker 拉取可能报 no matching manifest
          provenance: false
          tags: ${{ steps.tags.outputs.value }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          labels: |
            org.opencontainers.image.source=https://github.com/huangxd-/danmu_api
            org.opencontainers.image.version=${{ steps.ver.outputs.value }}

      - name: Record built fingerprint
        run: echo "${{ needs.check.outputs.upstream_sha }}${BUILD_REV}${{ needs.check.outputs.hub }}${{ needs.check.outputs.acr }}" > last-build.txt

      - name: Commit last-build.txt
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add last-build.txt
          if git diff --staged --quiet; then
            echo "指纹未变化，无需提交。"
          else
            git commit -m "build: 上游 ${{ needs.check.outputs.upstream_sha }} 构建完成（armv7）"
            git pull --rebase origin main
            git push
          fi
